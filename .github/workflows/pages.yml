name: Deploy PocketMind to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build PocketMind v0.6.2
        shell: bash
        run: |
          npm install --no-save @wllama/wllama@3.6.1
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ dist/

          mkdir -p dist/vendor/wllama
          cp -R node_modules/@wllama/wllama/esm dist/vendor/wllama/
          test -f dist/vendor/wllama/esm/index.js
          test -f dist/vendor/wllama/esm/wasm/wllama.wasm

          python3 - <<'PY'
          from pathlib import Path
          import re

          cpu = Path('dist/cpu.js')
          s = cpu.read_text()
          s = s.replace('tensorblock/SmolLM2-360M-Instruct-GGUF', 'bartowski/SmolLM2-360M-Instruct-GGUF')

          s = re.sub(
              r'async function diagnostic\(show=true\)\{.*?\n\}\nasync function load\(\)',
              '''async function diagnostic(show=true){
            if(!allowed()){if(show)add("system","PocketMind needs HTTPS.");return false;}
            if(!navigator.onLine){if(show)add("system","The first model download needs internet.");return false;}
            progress(0,"Bundled CPU runtime is ready to test directly.");
            if(show)add("system","PocketMind v0.6.2 bundles its CPU runtime with the app. Load Local AI tests the real runtime directly.");
            return true;
          }
          async function load()''',
              s,
              flags=re.S,
          )

          s = s.replace('if(!await diagnostic(false)){add("system","Pre-load check failed. Tap Run connection test for details.");return;}\n', '')
          s = s.replace('const pkg=await import("https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/+esm");', 'const pkg=await import("./vendor/wllama/esm/index.js");')
          s = s.replace('default:"https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/esm/wasm/wllama.wasm"', 'default:"./vendor/wllama/esm/wasm/wllama.wasm"')
          s = re.sub(r'\n\s*// Force the plain CPU/WASM path.*?try\{engine\.setCompat\(null\);\}catch\(e\)\{\}', '', s, flags=re.S)
          s = re.sub(r'\{n_ctx:\d+,n_batch:\d+,n_threads:1,n_gpu_layers:0', '{n_ctx:384,n_batch:16,n_threads:1,n_gpu_layers:0', s)
          s = s.replace('PocketMind v0.5.2 is using CPU/WebAssembly', 'PocketMind v0.6.2 is using bundled CPU/WebAssembly')

          # Static questions such as "Where is the UK?" should use the local model directly.
          # Web research is reserved for questions that are actually time-sensitive or explicitly request it.
          s = re.sub(
              r'function shouldResearch\(q\)\{.*?\n\}',
              '''function shouldResearch(q){
            const mode=$("researchMode").value;
            if(mode==="always")return true;
            if(mode==="never")return false;
            return /\\b(latest|today|current|news|search|internet|web|recent|updated|breaking|weather|price|prices)\\b/i.test(q);
          }''',
              s,
              count=1,
              flags=re.S,
          )
          s = s.replace('.slice(0,1600)', '.slice(0,700)')

          # Add a generation abort controller.
          s = s.replace('let engine=null,loading=false,ready=false,deferredInstall=null;',
                        'let engine=null,loading=false,ready=false,deferredInstall=null,generationAbort=null;')

          # Stream CPU output so the user sees tokens immediately, keep prompts small,
          # and make the Send button act as Stop while generation is running.
          s = re.sub(
              r'async function send\(\)\{.*?\n\}\nfunction addMemory',
              r'''async function send(){
            const inp=$("input"),btn=$("send");
            if(generationAbort){generationAbort.abort();return;}
            const q=inp.value.trim();if(!q)return;
            inp.value="";add("user",q);
            const m=remember(q);if(m){add("assistant",`I’ll remember: "${m}"`);return;}
            if(!ready){add("system","Load the local AI first.");return;}

            btn.textContent="Stop";
            generationAbort=new AbortController();
            const controller=generationAbort;
            let ticker=null;
            let bubble=null;
            let gotToken=false;
            const started=Date.now();

            try{
              let page=null;
              if(shouldResearch(q)&&navigator.onLine){
                try{page=await research(q);}catch(e){console.warn(e);}
              }

              bubble=add("assistant","Thinking locally… 0s");
              ticker=setInterval(()=>{
                if(!gotToken&&bubble){
                  const secs=Math.floor((Date.now()-started)/1000);
                  bubble.textContent=`Thinking locally… ${secs}s`;
                }
              },1000);

              const stream=await engine.createChatCompletion({
                messages:messages(q,page),
                max_tokens:72,
                temperature:.3,
                top_p:.9,
                top_k:40,
                stream:true,
                abortSignal:controller.signal
              });

              let ans="";
              for await(const chunk of stream){
                const delta=chunk?.choices?.[0]?.delta?.content||"";
                if(delta){
                  if(!gotToken){gotToken=true;if(ticker){clearInterval(ticker);ticker=null;}}
                  ans+=delta;
                  bubble.textContent=ans;
                  $("chat").scrollTop=$("chat").scrollHeight;
                }
              }

              if(!ans){bubble.textContent="I couldn't produce an answer.";}
              if(page){
                const d=document.createElement("div");d.className="sources";d.innerHTML="<strong>Source</strong>";
                const a=document.createElement("a");a.target="_blank";a.rel="noopener";a.href=page.url;a.textContent=page.title;d.appendChild(a);bubble.appendChild(d);
              }
              if(ans){
                recent.push({role:"user",content:q},{role:"assistant",content:ans});
                if(recent.length>6)recent=recent.slice(-6);
                sessionStorage.setItem(CHAT_KEY,JSON.stringify(recent));
              }
            }catch(e){
              if(controller.signal.aborted){
                if(bubble&&!gotToken)bubble.textContent="Stopped.";
              }else{
                add("system","Generation failed: "+(e?.message||e));
              }
            }finally{
              if(ticker)clearInterval(ticker);
              if(generationAbort===controller)generationAbort=null;
              btn.textContent="Send";
            }
          }
          function addMemory''',
              s,
              count=1,
              flags=re.S,
          )
          cpu.write_text(s)

          index = Path('dist/index.html')
          h = index.read_text()
          h = h.replace('PWA v0.5.2 CPU', 'PWA v0.6.2 CPU')
          h = h.replace('Run the compatibility check, then download the model once.', 'Bundled CPU runtime with streamed local answers.')
          h = h.replace('<title>PocketMind AI v0.5</title>', '<title>PocketMind AI v0.6.2</title>')
          index.write_text(h)

          sw = Path('dist/sw.js')
          w = sw.read_text()
          w = re.sub(r'pocketmind-shell-v[^"\']+', 'pocketmind-shell-v0620', w, count=1)
          sw.write_text(w)
          PY

          node --check dist/cpu.js
          grep -q 'PWA v0.6.2 CPU' dist/index.html
          grep -q 'bartowski/SmolLM2-360M-Instruct-GGUF' dist/cpu.js
          grep -q './vendor/wllama/esm/index.js' dist/cpu.js
          grep -q './vendor/wllama/esm/wasm/wllama.wasm' dist/cpu.js
          grep -q 'stream:true' dist/cpu.js
          grep -q 'Thinking locally' dist/cpu.js
          grep -q 'generationAbort' dist/cpu.js
          ! grep -q 'Pre-load check failed' dist/cpu.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
