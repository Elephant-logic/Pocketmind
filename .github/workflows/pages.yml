name: Deploy PocketMind to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build PocketMind v0.6.1
        shell: bash
        run: |
          npm install --no-save @wllama/wllama@3.6.1
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ dist/

          mkdir -p dist/vendor/wllama
          cp -R node_modules/@wllama/wllama/esm dist/vendor/wllama/
          test -f dist/vendor/wllama/esm/index.js
          test -f dist/vendor/wllama/esm/wasm/wllama.wasm

          python3 - <<'PY'
          from pathlib import Path
          import re

          cpu = Path('dist/cpu.js')
          s = cpu.read_text()
          s = s.replace('tensorblock/SmolLM2-360M-Instruct-GGUF', 'bartowski/SmolLM2-360M-Instruct-GGUF')
          s = re.sub(
              r'async function diagnostic\(show=true\)\{.*?\n\}\nasync function load\(\)',
              '''async function diagnostic(show=true){
            if(!allowed()){if(show)add("system","PocketMind needs HTTPS.");return false;}
            if(!navigator.onLine){if(show)add("system","The first model download needs internet.");return false;}
            progress(0,"No pre-load gate. The bundled CPU runtime will be tested by Load local AI.");
            if(show)add("system","PocketMind v0.6.1 bundles its CPU runtime with the app. Tap Load local AI to try the real runtime directly.");
            return true;
          }
          async function load()''',
              s,
              flags=re.S,
          )
          s = s.replace('if(!await diagnostic(false)){add("system","Pre-load check failed. Tap Run connection test for details.");return;}\n', '')
          s = s.replace('const pkg=await import("https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/+esm");', 'const pkg=await import("./vendor/wllama/esm/index.js");')
          s = s.replace('default:"https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/esm/wasm/wllama.wasm"', 'default:"./vendor/wllama/esm/wasm/wllama.wasm"')
          s = re.sub(r'\n\s*// Force the plain CPU/WASM path.*?try\{engine\.setCompat\(null\);\}catch\(e\)\{\}', '', s, flags=re.S)
          s = s.replace('{n_ctx:768,n_batch:64,n_threads:1,n_gpu_layers:0', '{n_ctx:512,n_batch:16,n_threads:1,n_gpu_layers:0')
          s = s.replace('PocketMind v0.5.2 is using CPU/WebAssembly', 'PocketMind v0.6.1 is using bundled CPU/WebAssembly')
          cpu.write_text(s)

          index = Path('dist/index.html')
          h = index.read_text()
          h = h.replace('PWA v0.5.2 CPU', 'PWA v0.6.1 CPU')
          h = h.replace('Run the compatibility check, then download the model once.', 'Bundled CPU runtime: no external module CDN and no pre-load gate.')
          h = h.replace('<title>PocketMind AI v0.5</title>', '<title>PocketMind AI v0.6.1</title>')
          index.write_text(h)

          sw = Path('dist/sw.js')
          w = sw.read_text()
          w = re.sub(r'pocketmind-shell-v[^"\']+', 'pocketmind-shell-v0610', w, count=1)
          sw.write_text(w)
          PY

          node --check dist/cpu.js
          grep -q 'PWA v0.6.1 CPU' dist/index.html
          grep -q 'bartowski/SmolLM2-360M-Instruct-GGUF' dist/cpu.js
          grep -q './vendor/wllama/esm/index.js' dist/cpu.js
          grep -q './vendor/wllama/esm/wasm/wllama.wasm' dist/cpu.js
          ! grep -q 'Pre-load check failed' dist/cpu.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
