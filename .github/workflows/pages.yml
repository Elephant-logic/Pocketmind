name: Deploy PocketMind to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build PocketMind v0.9.2
        shell: bash
        run: |
          npm install --no-save @wllama/wllama@3.6.1 fast-xml-parser@5
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='scripts' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ dist/

          mkdir -p dist/vendor/wllama
          cp -R node_modules/@wllama/wllama/esm dist/vendor/wllama/
          test -f dist/vendor/wllama/esm/index.js
          test -f dist/vendor/wllama/esm/wasm/wllama.wasm

          # News is fetched on the GitHub runner; the phone only reads same-origin news.json.
          node scripts/build-news.mjs

          python3 - <<'PY'
          from pathlib import Path
          import re

          cpu = Path('dist/cpu.js')
          s = cpu.read_text()
          s = s.replace('tensorblock/SmolLM2-360M-Instruct-GGUF', 'bartowski/SmolLM2-360M-Instruct-GGUF')
          s = re.sub(
              r'async function diagnostic\(show=true\)\{.*?\n\}\nasync function load\(\)',
              '''async function diagnostic(show=true){
            if(!allowed()){if(show)add("system","PocketMind needs HTTPS.");return false;}
            if(!navigator.onLine){if(show)add("system","The first model download needs internet.");return false;}
            progress(0,"Bundled CPU runtime is ready to test directly.");
            if(show)add("system","PocketMind v0.9.2 bundles its CPU runtime with the app. Load Local AI tests the real runtime directly.");
            return true;
          }
          async function load()''',
              s,
              flags=re.S,
          )
          s = s.replace('if(!await diagnostic(false)){add("system","Pre-load check failed. Tap Run connection test for details.");return;}\n', '')
          s = s.replace('const pkg=await import("https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/+esm");', 'const pkg=await import("./vendor/wllama/esm/index.js");')
          s = s.replace('default:"https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/esm/wasm/wllama.wasm"', 'default:"./vendor/wllama/esm/wasm/wllama.wasm"')
          s = re.sub(r'\n\s*// Force the plain CPU/WASM path.*?try\{engine\.setCompat\(null\);\}catch\(e\)\{\}', '', s, flags=re.S)
          s = re.sub(r'\{n_ctx:\d+,n_batch:\d+,n_threads:1,n_gpu_layers:0', '{n_ctx:768,n_batch:16,n_threads:1,n_gpu_layers:0', s)
          s = re.sub(r'PocketMind v[0-9.]+ is using (?:bundled )?CPU/WebAssembly', 'PocketMind v0.9.2 is using bundled CPU/WebAssembly', s)

          s = s.replace(
              'If evidence is insufficient, say so.`;',
              'If evidence is insufficient, say so. Keep normal answers concise, usually under 120 words. Always finish the final sentence; never stop mid-sentence.`;'
          )

          s = re.sub(
              r'function shouldResearch\(q\)\{.*?\n\}',
              '''function shouldResearch(q){
            const mode=$("researchMode").value;
            if(mode==="always")return true;
            if(mode==="never")return false;
            return /\\b(latest|today|current|news|headlines|breaking|recent|updated|happening|search|internet|web|weather|price|prices)\\b/i.test(q);
          }''',
              s,
              count=1,
              flags=re.S,
          )
          s = s.replace('.slice(0,1600)', '.slice(0,650)')
          s = s.replace('let engine=null,loading=false,ready=false,deferredInstall=null;', 'let engine=null,loading=false,ready=false,deferredInstall=null,generationAbort=null;')

          s = re.sub(
              r'async function send\(\)\{.*?\n\}\nfunction addMemory',
              r'''async function send(){
            const inp=$("input"),btn=$("send");
            if(generationAbort){generationAbort.abort();return;}
            const q=inp.value.trim();if(!q)return;
            inp.value="";add("user",q);
            const m=remember(q);if(m){add("assistant",`I’ll remember: "${m}"`);return;}
            if(!ready){add("system","Load the local AI first.");return;}
            btn.textContent="Stop";
            generationAbort=new AbortController();
            const controller=generationAbort;
            const isNewsSummary=q.startsWith("NEWS_SUMMARY_REQUEST");
            let ticker=null,bubble=null,gotToken=false;
            const started=Date.now();
            try{
              let page=null;
              if(!isNewsSummary&&shouldResearch(q)&&navigator.onLine){try{page=await research(q);}catch(e){console.warn(e);}}
              bubble=add("assistant","Thinking locally… 0s");
              ticker=setInterval(()=>{if(!gotToken&&bubble){bubble.textContent=`Thinking locally… ${Math.floor((Date.now()-started)/1000)}s`; }},1000);
              const allMessages=messages(q,page);
              const modelMessages=isNewsSummary?[allMessages[0],allMessages[allMessages.length-1]]:allMessages;
              const stream=await engine.createChatCompletion({messages:modelMessages,max_tokens:isNewsSummary?256:192,temperature:.25,top_p:.9,top_k:40,stream:true,abortSignal:controller.signal});
              let ans="";
              for await(const chunk of stream){const delta=chunk?.choices?.[0]?.delta?.content||"";if(delta){if(!gotToken){gotToken=true;if(ticker){clearInterval(ticker);ticker=null;}}ans+=delta;bubble.textContent=ans;$("chat").scrollTop=$("chat").scrollHeight;}}
              if(!ans)bubble.textContent="I couldn't produce an answer.";
              if(page){const d=document.createElement("div");d.className="sources";d.innerHTML="<strong>Source</strong>";const a=document.createElement("a");a.target="_blank";a.rel="noopener";a.href=page.url;a.textContent=page.title;d.appendChild(a);bubble.appendChild(d);}
              if(ans&&!isNewsSummary){recent.push({role:"user",content:q},{role:"assistant",content:ans});if(recent.length>6)recent=recent.slice(-6);sessionStorage.setItem(CHAT_KEY,JSON.stringify(recent));}
            }catch(e){if(controller.signal.aborted){if(bubble&&!gotToken)bubble.textContent="Stopped.";}else add("system","Generation failed: "+(e?.message||e));}
            finally{if(ticker)clearInterval(ticker);if(generationAbort===controller)generationAbort=null;btn.textContent="Send";}
          }
          function addMemory''',
              s,
              count=1,
              flags=re.S,
          )
          cpu.write_text(s)

          news = Path('dist/news-v09.js')
          n = news.read_text()
          n = re.sub(r'const VERSION = "PWA v[^"]+";', 'const VERSION = "PWA v0.9.2 SERVER NEWS";', n, count=1)
          n = re.sub(
              r'    const compact = items\.map\(\(x, i\) => .*?\n    const prompt = `.*?`;\n',
              '''    const compact = items.map((x, i) => {
      const shortSummary = String(x.summary || "").replace(/\\s+/g, " ").trim().slice(0, 140);
      return `${i + 1}. ${x.title} — ${x.source}${shortSummary ? ` — ${shortSummary}` : ""}`;
    }).join("\\n");
    const prompt = `NEWS_SUMMARY_REQUEST
Summarise all ${items.length} source items. Write exactly one short bullet for each numbered item, in the same order. Keep each bullet under 18 words. Use only the supplied text, do not invent facts, and do not omit an item.

${compact}`;
''',
              n,
              count=1,
              flags=re.S,
          )
          news.write_text(n)

          index = Path('dist/index.html')
          h = index.read_text()
          h = re.sub(r'PWA v[0-9.]+(?: SERVER NEWS| NEWS| CPU)?', 'PWA v0.9.2 SERVER NEWS', h)
          h = re.sub(r'PocketMind v[0-9.]+', 'PocketMind v0.9.2', h)
          h = re.sub(r'<title>.*?</title>', '<title>PocketMind AI v0.9.2</title>', h, count=1)
          index.write_text(h)

          sw = Path('dist/sw.js')
          w = sw.read_text()
          w = re.sub(r'pocketmind-shell-v[0-9]+', 'pocketmind-shell-v0920', w, count=1)
          w = re.sub(r'pocketmind-news-v[0-9]+', 'pocketmind-news-v0920', w, count=1)
          sw.write_text(w)
          PY

          node --check dist/cpu.js
          node --check dist/news-v09.js
          test -f dist/news.json
          node -e 'const n=require("./dist/news.json"); if(!(n.categories?.uk?.length>0)) process.exit(1); console.log(`validated UK headlines: ${n.categories.uk.length}`)'
          grep -q 'PWA v0.9.2 SERVER NEWS' dist/index.html
          grep -q 'PWA v0.9.2 SERVER NEWS' dist/news-v09.js
          grep -q 'NEWS_SUMMARY_REQUEST' dist/news-v09.js
          grep -q 'max_tokens:isNewsSummary?256:192' dist/cpu.js
          grep -q 'n_ctx:768' dist/cpu.js
          grep -q 'never stop mid-sentence' dist/cpu.js
          grep -q './news.json' dist/news-v09.js
          grep -q 'bartowski/SmolLM2-360M-Instruct-GGUF' dist/cpu.js
          grep -q './vendor/wllama/esm/index.js' dist/cpu.js
          grep -q 'stream:true' dist/cpu.js
          ! grep -q 'Pre-load check failed' dist/cpu.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
