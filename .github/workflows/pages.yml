name: Deploy PocketMind to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build PocketMind v0.9.2
        shell: bash
        run: |
          npm install --no-save @wllama/wllama@3.6.1 fast-xml-parser@5
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='scripts' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            ./ dist/

          mkdir -p dist/vendor/wllama
          cp -R node_modules/@wllama/wllama/esm dist/vendor/wllama/
          test -f dist/vendor/wllama/esm/index.js
          test -f dist/vendor/wllama/esm/wasm/wllama.wasm

          node scripts/build-news.mjs
          python3 scripts/patch-build.py

          node --check dist/cpu.js
          node --check dist/news-v09.js
          test -f dist/news.json
          node -e 'const n=require("./dist/news.json"); if(!(n.categories?.uk?.length>0)) process.exit(1); console.log(`validated UK headlines: ${n.categories.uk.length}`)'
          grep -q 'PWA v0.9.2 SERVER NEWS' dist/index.html
          grep -q 'PWA v0.9.2 SERVER NEWS' dist/news-v09.js
          grep -q 'NEWS_SUMMARY_REQUEST' dist/news-v09.js
          grep -q 'max_tokens:isNewsSummary?256:192' dist/cpu.js
          grep -q 'n_ctx:768' dist/cpu.js
          grep -q 'never stop mid-sentence' dist/cpu.js
          grep -q './news.json' dist/news-v09.js
          grep -q 'bartowski/SmolLM2-360M-Instruct-GGUF' dist/cpu.js
          grep -q './vendor/wllama/esm/index.js' dist/cpu.js
          grep -q 'stream:true' dist/cpu.js
          ! grep -q 'Pre-load check failed' dist/cpu.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
